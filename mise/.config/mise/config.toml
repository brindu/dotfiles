[settings]
# Needed by the conda backend (prebuilt Postgres, see below).
experimental = true

[settings.python]
precompiled_flavor = "install_only"

[env]
# Claude Code is installed by mise (below). Stop its built-in updater from
# dropping a second, native copy into ~/.local/bin. Upgrade with `mise up claude`.
DISABLE_AUTOUPDATER = "1"
# Postgres data lives outside the mise install dir so `mise up`/`mise prune`
# never deletes it. One dir per major version (data dirs are not portable across majors).
PGDATA = "{{env.HOME}}/.local/share/postgres/18"

[tools]
# ─── Languages ───────────────────────────────────────────────────
ruby = "3.3.6"
python = "latest"
node = "lts"
uv = "latest"

# ─── Shell & editor (referenced by tracked configs) ──────────────
neovim = "latest"      # nvim package
tmux = "latest"        # tmux package
direnv = "latest"      # .zshrc hook
tree-sitter = "latest" # nvim-treesitter
ripgrep = "latest"     # telescope live_grep, `shame` alias
fd = "latest"          # telescope find_files
git-lfs = "latest"     # git package [filter "lfs"]
stylua = "latest"      # conform.nvim (lua)
shfmt = "latest"       # conform.nvim (sh)
"npm:prettier" = "latest" # conform.nvim (js/ts/json/yaml/md/css/html)
delta = "latest"       # `gdiff` alias
eza = "latest"         # `tree` alias

# ─── Databases ───────────────────────────────────────────────────
# conda build: prebuilt, ships its own OpenSSL/ICU, so no Homebrew libs needed.
"conda:postgresql" = "18"
redis = "latest"       # compiles from source; needs only Xcode CLT

# ─── Dev CLIs ────────────────────────────────────────────────────
gh = "latest"
heroku = "latest"
"github:raine/workmux" = "latest" # tmux bindings + .zshrc completions

# ─── AI assistants ───────────────────────────────────────────────
claude = "latest"
codex = "latest"
