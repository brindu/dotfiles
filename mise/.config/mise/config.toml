[settings]
# Needed by the conda backend (prebuilt Postgres, see below).
experimental = true

[settings.python]
precompiled_flavor = "install_only"

[settings.ruby]
# Use only the prebuilt jdx/ruby binaries. Fail instead of compiling from
# source, which would silently link against whatever OpenSSL it finds (e.g. Homebrew's).
compile = false

[vars]
# Chrome for Testing (see the tool at the end). The version is in the download URL
# and in BROWSER_PATH, so "latest" cannot work: bump it here by hand.
chrome_version = "157.0.8103.78"

[env]
# Claude Code is installed by mise (below). Stop its built-in updater from
# dropping a second, native copy into ~/.local/bin. Upgrade with `mise up claude`.
DISABLE_AUTOUPDATER = "1"
# Postgres data lives outside the mise install dir so `mise up`/`mise prune`
# never deletes it. One dir per major version (data dirs are not portable across majors).
PGDATA = "{{env.HOME}}/.local/share/postgres/18"
# ruby-vips loads libvips by name through the ffi gem (>= 1.17), which searches
# LD_LIBRARY_PATH before /opt/homebrew/lib. macOS dyld ignores this variable and
# SIP does not strip it (unlike DYLD_*), so it reaches only ffi, even via /usr/bin/env.
LD_LIBRARY_PATH = "{{env.HOME}}/.local/share/mise/installs/conda-libvips/latest/lib"
# Ferrum/Cuprite (Rails system specs) ignore PATH on macOS: they look only in
# /Applications. Point them at the mise-installed Chrome for Testing.
BROWSER_PATH = "{{env.HOME}}/.local/share/mise/installs/http-chrome-for-testing/{{vars.chrome_version}}/chrome-mac-arm64/Google Chrome for Testing.app/Contents/MacOS/Google Chrome for Testing"

[tools]
# ─── Languages ───────────────────────────────────────────────────
ruby = "3.3.6"
python = "latest"
node = "lts"
"npm:yarn" = "1"       # Yarn classic for projects with yarn.lock (Rewardful)
uv = "latest"
rust = "stable"        # via rustup (~/.rustup, ~/.cargo)

# ─── Shell & editor (referenced by tracked configs) ──────────────
neovim = "latest"      # nvim package
tmux = "latest"        # tmux package
direnv = "latest"      # .zshrc hook
tree-sitter = "latest" # nvim-treesitter
ripgrep = "latest"     # telescope live_grep, `shame` alias
fd = "latest"          # telescope find_files
git-lfs = "latest"     # git package [filter "lfs"]
stylua = "latest"      # conform.nvim (lua)
shfmt = "latest"       # conform.nvim (sh)
"npm:prettier" = "latest" # conform.nvim (js/ts/json/yaml/md/css/html)
delta = "latest"       # `gdiff` alias
eza = "latest"         # `tree` alias

# ─── Databases ───────────────────────────────────────────────────
# conda build: prebuilt, ships its own OpenSSL/ICU, so no Homebrew libs needed.
"conda:postgresql" = "18"
redis = "latest"       # compiles from source; needs only Xcode CLT

# ─── Image processing (Rails Active Storage variants) ────────────
"conda:imagemagick" = "latest" # mini_magick (Rewardful) runs `magick` from PATH
"conda:libvips" = "latest"     # ruby-vips (Rails 7+ default variant processor)
"conda:poppler" = "latest"     # pdfinfo: active_storage_validations PDF checks (Rewardful); pdftoppm: Rails PDF previews

# ─── Dev CLIs ────────────────────────────────────────────────────
gh = "latest"
jq = "latest"          # claude statusline.sh + branch-guard hook
heroku = "latest"
"github:raine/workmux" = "latest" # tmux bindings + .zshrc completions
glow = "latest"        # terminal Markdown viewer
lazygit = "latest"

# ─── AI assistants ───────────────────────────────────────────────
claude = "latest"
codex = "latest"

# ─── Browser for system specs (Ferrum/Cuprite) ───────────────────
# Version pinned in [vars]. mac-arm64 only.
[tools."http:chrome-for-testing"]
version = "{{vars.chrome_version}}"
url = "https://storage.googleapis.com/chrome-for-testing-public/{{version}}/mac-arm64/chrome-mac-arm64.zip"
bin_path = "chrome-mac-arm64/Google Chrome for Testing.app/Contents/MacOS"
