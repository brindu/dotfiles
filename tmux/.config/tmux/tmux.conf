# act like GNU screen
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# window/pane numbering
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# scrollback
set -g history-limit 100000

# colors / terminal
set -g default-terminal "tmux-256color"
set -as terminal-overrides ",*:RGB"
set -ga terminal-overrides ",*:Tc"

# behavior
set-option -g allow-rename off
set -sg escape-time 0
set -g focus-events on
set -g allow-passthrough on
setw -g extended-keys on
set -s set-clipboard on
set -g mouse on
setw -g aggressive-resize on
set -g status-interval 5

# bindings
bind a last-window

# window picker — recovered to f since prefix w is now workmux dashboard
bind f choose-tree -Zw

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# resize panes
bind-key h resize-pane -L 5
bind-key j resize-pane -D 5
bind-key k resize-pane -U 5
bind-key l resize-pane -R 5

# reload + capture scrollback
bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded"
bind P command-prompt -p 'save scrollback to:' -I '~/scroll.log' \
       'capture-pane -S - ; save-buffer %1 ; delete-buffer'

# workmux dashboard in a popup (floating, full-screen-ish)
bind w display-popup -E -w 90% -h 90% "workmux dashboard"

# workmux sidebar toggle (in-tmux split, persistent until toggled off)
bind e run-shell "workmux sidebar"

# ─── Theme (Tokyo Night) ─────────────────────────────────────────
set -g status-style "bg=#1a1b26,fg=#c0caf5"

set -g status-left "#[fg=#1a1b26,bg=#7aa2f7,bold] #S #[default] "
set -g status-left-length 30
set -g status-right "#[fg=#7dcfff]%H:%M  #[fg=#bb9af7]%d-%b "
set -g status-right-length 30

setw -g window-status-format "#[fg=#565f89] #I:#W "
setw -g window-status-current-format "#[fg=#1a1b26,bg=#bb9af7,bold] #I:#W "
setw -g window-status-separator ""

set -g pane-border-style "fg=#565f89"
set -g pane-active-border-style "fg=#7aa2f7"

set -g message-style "bg=#7aa2f7,fg=#1a1b26"
set -g message-command-style "bg=#bb9af7,fg=#1a1b26"
set -g mode-style "bg=#7aa2f7,fg=#1a1b26"

# plugins (TPM)
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'

set -g @resurrect-strategy-vim 'session'
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'

run '~/.tmux/plugins/tpm/tpm'
